{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{blog_title | default:"SuperBlog"}}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                        display: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            black: '#242424',
                            gray: '#f9f9f9',
                            dark: '#191919',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #242424; }
        /* Global Elegant Editorial Form Styles */
        input[type="text"], input[type="email"], input[type="password"], textarea, select {
            width: 100%;
            border-radius: 0.5rem;
            border: 1px solid #d1d5db;
            padding: 0.75rem 1rem;
            transition: all 0.2s ease;
            background: #ffffff;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            font-family: 'Inter', sans-serif;
        }
        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #111827;
            box-shadow: 0 0 0 1px #111827;
        }
        .font-serif-content { font-family: 'Lora', serif; }
        .nav-border { border-bottom: 1px solid rgba(230,230,230,1); }
        .medium-shadow { box-shadow: rgba(0, 0, 0, 0.12) 0px 2px 8px 0px; }
        .btn-black { background-color: #242424; color: white; border-radius: 9999px; }
        .btn-black:hover { background-color: #1a1a1a; }
    </style>
</head>
<body class="flex flex-col min-h-screen antialiased selection:bg-black selection:text-white">
    
    <!-- Header -->
    {% include 'blog/includes/header.html' %}
    
    <!-- Dynamic content -->
    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-10 mt-20 max-w-7xl">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include 'blog/includes/footer.html' %}

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 50, duration: 800 });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
