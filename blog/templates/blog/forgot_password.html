{% extends 'blog/base.html' %}

{% block content %}
<div class="min-h-[70vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8" data-aos="fade-up">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <h2 class="mt-6 text-4xl font-display font-black text-gray-900 tracking-tight">Forgot password?</h2>
        <p class="mt-2 text-sm text-gray-600 font-medium">
            No worries, we'll send you reset instructions.
        </p>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 sm:px-10 border border-gray-200 shadow-sm rounded-2xl">
            
            {% include 'blog/includes/errors.html' %}
            {% if messages %}
                <div class="mb-5">
                    {% for message in messages %}
                        <div class="p-4 rounded-lg {% if message.tags == 'error' %}bg-red-50 text-red-700{% else %}bg-green-50 text-green-700{% endif %} text-sm font-bold">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
                
            <form class="space-y-6" method="POST">
                {% csrf_token %}
                <div>
                    <label for="email" class="block text-sm font-bold text-gray-900 tracking-wide mb-1.5">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-gray-900 hover:bg-black focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 transition-colors">
                        Reset Password
                    </button>
                </div>
            </form>

            <div class="mt-8 flex items-center justify-center">
                <a href="{% url 'blog:login' %}" class="text-sm font-bold text-gray-600 hover:text-gray-900 transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to log in
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
