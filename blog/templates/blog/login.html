{% extends 'blog/base.html' %}

{% block content %}
<div class="min-h-[70vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8" data-aos="fade-up">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <h2 class="mt-6 text-4xl font-display font-black text-gray-900 tracking-tight">Welcome back</h2>
        <p class="mt-2 text-sm text-gray-600 font-medium">
            Don't have an account? 
            <a href="{% url 'blog:register' %}" class="font-bold text-gray-900 hover:text-gray-500 transition-colors border-b border-gray-900 hover:border-gray-500 pb-0.5">Sign up</a>
        </p>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 sm:px-10 border border-gray-200 shadow-sm rounded-2xl">
            
            {% include 'blog/includes/errors.html' %}
                
            <form class="space-y-6" method="POST">
                {% csrf_token %}
                <div>
                    <label for="username" class="block text-sm font-bold text-gray-900 tracking-wide mb-1.5">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-sm font-bold text-gray-900 tracking-wide">Password</label>
                        <a href="{% url 'blog:forgot_password' %}" class="text-xs font-medium text-gray-500 hover:text-gray-900 transition-colors border-b border-transparent hover:border-gray-900 pb-0.5">Forgot password?</a>
                    </div>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-gray-900 hover:bg-black focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 transition-colors">
                        Sign In
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
